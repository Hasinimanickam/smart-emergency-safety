```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Emergency - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- Emergency Icon -->
            <div class="login-icon">
                🚨
            </div>

            <!-- Title -->
            <h1>Create Account</h1>

            <p class="login-subtitle">
                Join Smart Emergency
            </p>


            <!-- Register Form -->
            <form action="/register" method="POST">

                <!-- Full Name -->
                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required>

                </div>


                <!-- Create Account Button -->
                <button
                    type="submit"
                    class="login-btn">

                    📝 Create Account

                </button>

            </form>


            <!-- Login Link -->
            <p class="login-footer">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
```
