
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Emergency - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- Emergency Icon -->
            <div class="login-icon">
                🚨
            </div>

            <!-- Title -->
            <h1>Smart Emergency</h1>

            <p class="login-subtitle">
                Your intelligent safety companion
            </p>


            <!-- Login Form -->
            <form action="/login" method="POST">

                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn">

                    🔐 Login

                </button>

            </form>


            <!-- Register -->
            <p class="login-footer">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
